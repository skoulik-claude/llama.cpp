name: BrokerAI release

# The llama-server builds that BrokerAI's PII tool bundles: macOS arm64 (Metal) and
# Windows x64 (CUDA), published as one GitHub release with SHA256SUMS. Runs on a
# brokerai-* tag of brokerai-serving, or by hand (build only, no release).
# Its own file rather than an edit to release.yml, so a rebase onto upstream never
# conflicts with it.

on:
  push:
    tags: ['brokerai-*']
  workflow_dispatch:

permissions:
  contents: write

# Off, because BrokerAI's server needs none of them and each is a dependency or a capability:
# - LLAMA_OPENSSL: left on, the server links whatever OpenSSL the runner has (Homebrew's on
#   macOS) and will not start on a machine without that exact library. No HTTPS is needed:
#   local model files, a private socket or loopback.
# - LLAMA_USE_PREBUILT_UI: left on, the build downloads the web chat UI from Hugging Face and
#   the server serves it. BrokerAI never uses it (and launches with --no-ui besides).
# - LLAMA_SUBPROCESS: left on, the server can start other programs (the UI's MCP servers,
#   router mode). A server that is handed classified pages has no need to.
env:
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_OPENSSL=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DLLAMA_SUBPROCESS=OFF"

jobs:
  macos-arm64:
    runs-on: macos-26

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 \
            -DCMAKE_INSTALL_RPATH='@loader_path' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release --target llama-server -j $(sysctl -n hw.logicalcpu)

      - name: Pack
        run: |
          cp LICENSE build/bin/
          tar -czf llama-server-${{ github.ref_name }}-macos-arm64.tar.gz -C build/bin .

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: macos-arm64
          path: llama-server-*-macos-arm64.tar.gz

  windows-cuda:
    runs-on: windows-2022

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # CUDA 13 covers Turing (RTX 20) to Blackwell (RTX 50) and needs an R580 driver or newer;
      # 12.4, the other version this action installs, stops before Blackwell. The version must
      # be one the action offers at this commit (11.7, 12.4, 13.1, 13.5 at upstream c0ab6e5c0):
      # an unknown one skips every install step and the build finds no nvcc. BrokerAI's
      # installer downloads the CUDA runtime pinned to this version's libraries, so moving it
      # moves those pins too.
      - name: Install CUDA Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.5'
          cuda_arch: x64

      - name: Install Ninja
        run: choco install ninja

      # Native code ("-real") for each generation BrokerAI supports - Turing (RTX 20), Ampere
      # (RTX 30), Ada (RTX 40), Blackwell (RTX 50) - and no PTX: upstream's default left Turing
      # PTX only, which the driver must compile at start-up, and PTX from CUDA 13.5 needs a driver
      # that new - on R580 (CUDA 13.0) the server died "the provided PTX was compiled with an
      # unsupported toolchain". Native code runs on any CUDA 13 driver.

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CUDA=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DCMAKE_CUDA_ARCHITECTURES=75-real;86-real;89-real;120a-real" %CMAKE_ARGS%
          cmake --build build --target llama-server -j %NUMBER_OF_PROCESSORS%

      # One static llama-server.exe with the C runtime linked in (/MT; with DLLs each would get a
      # runtime and heap of its own, and llama.cpp's pass C++ objects between them). Left: the
      # driver, cudart and cuBLAS - which BrokerAI's installer downloads, pinned, for llama-server
      # and OCR both - and vcomp140.dll, MSVC's OpenMP runtime, which exists only as a DLL and is
      # copied in beside the exe (Microsoft allows app-local copies).
      - name: Pack
        run: |
          Copy-Item LICENSE build\bin\
          $omp = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\*\x64\Microsoft.VC143.OpenMP\vcomp140.dll" | Sort-Object FullName | Select-Object -Last 1
          if (-not $omp) { Write-Error "vcomp140.dll not found"; exit 1 }
          Copy-Item $omp.FullName build\bin\
          7z a llama-server-${{ github.ref_name }}-win-cuda-13.5-x64.zip .\build\bin\*

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: win-cuda-x64
          path: llama-server-*-win-cuda-*-x64.zip

  release:
    needs: [macos-arm64, windows-cuda]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum llama-server-* > SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" llama-server-* SHA256SUMS \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "llama-server built from brokerai-serving at ${{ github.sha }}."
